function useLocalStorage(key,initial,mergeFn){
  const [val,setVal]=useState(()=>{
    try{
      const i=localStorage.getItem(key);
      if(!i)return initial;
      const parsed=JSON.parse(i);
      if(mergeFn)return mergeFn(parsed,initial);
      return parsed;
    }catch(e){return initial;}
  });
  useEffect(()=>{localStorage.setItem(key,JSON.stringify(val));},[key,val]);
  return [val,setVal];
}

// ============================================================
// UTILIDADES
// ============================================================
const fmtMoney=(n)=>"$"+(n||0).toFixed(2);
const fmtNum=(n)=>n.toLocaleString("es-EC");

function getBestSupplier(product){
  const entries=Object.entries(product.suppliers);
  if(!entries.length)return null;
  return entries.reduce((best,curr)=>curr[1].cost<best[1].cost?curr:best);
}

function getWorstSupplier(product){
  const entries=Object.entries(product.suppliers);
  if(!entries.length)return null;
  return entries.reduce((worst,curr)=>curr[1].cost>worst[1].cost?curr:worst);
}

function getAvgCost(product){
  const entries=Object.entries(product.suppliers);
  if(!entries.length)return 0;
  const total=entries.reduce((s,[,v])=>s+v.cost,0);
  return total/entries.length;
}

// COMPONENTE: IMAGEN SEGURA (no destruye el DOM al fallar)

function SafeImage({src,alt,className}){
  const [error,setError]=useState(false);
  if(error||!src){
    return <span className="text-3xl">📦</span>;
  }
  return <img src={src} alt={alt} className={className} onError={()=>setError(true)} loading="lazy" />;
}

// ---------- MÁQUINA ----------
// ---------- MÁQUINA ----------
function MachinePage({products,setProducts}){
  const [filter,setFilter]=useState("");
  const [cat,setCat]=useState("Todas");
  const [search,setSearch]=useState("");
  const [sellModal,setSellModal]=useState(null);
  const [infoModal,setInfoModal]=useState(null); // Modal de información detallada

  const timerRef = React.useRef(null);
  const isLongPress = React.useRef(false);

  const cats=["Todas",...new Set(products.map(p=>p.category))];
  const filtered=products.filter(p=>(cat==="Todas"||p.category===cat)&&p.name.toLowerCase().includes(filter.toLowerCase())&&p.name.toLowerCase().includes(search.toLowerCase()));

  // Manejadores para Long Press (mantener presionado)
  const handleTouchStart = (product) => {
    isLongPress.current = false;
    timerRef.current = setTimeout(() => {
      isLongPress.current = true;
      setInfoModal(product); // Abre modal de información
    }, 500); // 500ms para detectar pulsación larga
  };

  const handleTouchEnd = () => {
    if (timerRef.current) {
      clearTimeout(timerRef.current);
    }
  };

  const openSellModal=(product)=>{
    // Si fue pulsación larga, evita abrir la venta inmediatamente
    if (isLongPress.current) return;
    setSellModal({product,qty:1});
  };

  const closeSellModal=()=>{setSellModal(null);};
  const closeInfoModal=()=>{setInfoModal(null);};

  const adjustQty=(delta)=>{
    if(!sellModal)return;
    const max=sellModal.product.stock;
    const next=Math.max(1,Math.min(max,sellModal.qty+delta));
    setSellModal({...sellModal,qty:next});
  };

  const confirmSell=()=>{
    if(!sellModal||sellModal.qty<1)return;
    const {product,qty}=sellModal;
    setProducts(prev=>prev.map(p=>{
      if(p.id!==product.id||p.stock<qty)return p;
      const best=getBestSupplier(p);
      const cost=best?best[1].cost:getAvgCost(p);
      const revenue=qty*p.price;
      return{...p,stock:p.stock-qty,salesCount:p.salesCount+qty,totalSales:p.totalSales+revenue};
    }));
    setSellModal(null);
  };

  return (
    <div className="max-w-6xl mx-auto px-3 py-4 safe-bottom relative">
      <div className="mb-4">
        <input 
          type="text" 
          value={search} 
          onChange={e=>setSearch(e.target.value)} 
          placeholder="🔍 Buscar producto..." 
          className="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-sm text-white mb-3 focus:outline-none focus:border-orange-500 transition"
        />
        <div className="flex gap-2 overflow-x-auto pb-1">
          {cats.map(c=> (
            <button key={c} onClick={()=>setCat(c)} className={`shrink-0 px-3 py-1 rounded-full text-xs font-medium transition ${cat===c?"bg-slate-700 text-white":"text-slate-400 hover:text-white"}`}>{c}</button>
          ))}
        </div>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        {filtered.map(p=>{
          const best=getBestSupplier(p);
          const cost=best?best[1].cost:getAvgCost(p);
          const margin=((p.price-cost)/p.price*100).toFixed(1);
          return (
            <div 
              key={p.id} 
              onMouseDown={() => handleTouchStart(p)}
              onMouseUp={handleTouchEnd}
              onMouseLeave={handleTouchEnd}
              onTouchStart={() => handleTouchStart(p)}
              onTouchEnd={handleTouchEnd}
              className="bg-slate-800 rounded-xl p-3 card-hover border border-slate-700 relative flex flex-col select-none"
            >
              <div className="relative mb-2">
                <div className="w-full h-32 rounded-lg overflow-hidden bg-white/5 flex items-center justify-center">
                  <SafeImage src={p.image} alt={p.name} className="h-full w-full object-contain p-1" />
                </div>
                <span className={`absolute top-1.5 left-1.5 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-lg ${p.stock>5?"bg-emerald-500 text-white":p.stock>0?"bg-amber-500 text-white":"bg-red-500 text-white"}`}>
                  {p.stock} uds
                </span>
                <span className="absolute top-1.5 right-1.5 text-[9px] px-1.5 py-0.5 rounded-full bg-slate-900/80 text-slate-300 font-medium backdrop-blur-sm">
                  {p.category}
                </span>
              </div>

              <h3 className="text-sm font-bold text-white leading-tight mb-1.5 line-clamp-2">{p.name}</h3>

              <div className="flex items-end justify-between mb-2 mt-auto">
                <div>
                  <div className="text-xl font-bold text-emerald-400">{fmtMoney(p.price)}</div>
                  <div className="text-[10px] text-slate-400">Costo: {fmtMoney(cost)}</div>
                </div>
                <div className="text-right">
                  <div className="text-[10px] text-emerald-400 font-semibold">{margin}% margen</div>
                  <div className="text-[10px] text-slate-500">Vendidos: {p.salesCount}</div>
                </div>
              </div>

              <button onClick={()=>openSellModal(p)} disabled={p.stock<=0}
                className={`w-full py-2.5 rounded-lg text-xs font-bold transition mt-auto ${p.stock>0?"bg-orange-500 hover:bg-orange-600 text-white shadow-lg shadow-orange-500/20":"bg-slate-700 text-slate-500 cursor-not-allowed"}`}>
                {p.stock>0?"💵 VENDER":"❌ AGOTADO"}
              </button>
            </div>
          );
        })}
      </div>

      {/* Modal de Cantidad (Venta) */}
      {sellModal&&(
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm px-4" onClick={closeSellModal}>
          <div className="bg-slate-800 rounded-2xl border border-slate-600 p-5 w-full max-w-sm shadow-2xl" onClick={e=>e.stopPropagation()}>
            <h3 className="text-lg font-bold text-white mb-1">{sellModal.product.name}</h3>
            <p className="text-xs text-slate-400 mb-4">Precio: {fmtMoney(sellModal.product.price)} c/u • Stock: {sellModal.product.stock} uds</p>

            <div className="flex items-center justify-center gap-4 mb-5">
              <button onClick={()=>adjustQty(-1)} className="w-12 h-12 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold transition flex items-center justify-center">−</button>
              <div className="text-center">
                <div className="text-3xl font-bold text-white">{sellModal.qty}</div>
                <div className="text-[10px] text-slate-400">unidades</div>
              </div>
              <button onClick={()=>adjustQty(1)} className="w-12 h-12 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold transition flex items-center justify-center">+</button>
            </div>

function ResumenPage({products}){
  const totalStock=products.reduce((s,p)=>s+p.stock,0);
  const totalSales=products.reduce((s,p)=>s+p.totalSales,0);
  const totalSold=products.reduce((s,p)=>s+p.salesCount,0);
  const inventoryValue=products.reduce((s,p)=>{
    const best=getBestSupplier(p);
    const cost=best?best[1].cost:getAvgCost(p);
    return s+(cost*p.stock);
  },0);
  const potentialRevenue=products.reduce((s,p)=>s+(p.price*p.stock),0);
  const topProducts=[...products].sort((a,b)=>b.salesCount-a.salesCount).slice(0,5);

          <div className="text-[10px] text-slate-500">{totalSold} productos vendidos</div>

          <div className="text-xs text-slate-400 mb-1">Valor Inventario</div>

          {topProducts.map((p,i)=> (
            <div key={p.id} className="flex items-center justify-between py-2 border-b border-slate-700 last:border-0">
              <div className="flex items-center gap-2">
                <span className="w-5 h-5 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center text-xs font-bold">{i+1}</span>

    if(!newSupplier.name)return;
    const id="s"+(suppliers.length+1+Date.now());
    setSuppliers(prev=>[...prev,{id,...newSupplier}]);
    setNewSupplier({name:"",location:"",characteristics:"",type:"Mayorista",notes:"",color:"#f59e0b"});
    setShowForm(false);
  };

  const deleteSupplier=(id)=>{
    if(!confirm("¿Eliminar este proveedor?"))return;

                    <div className={`text-sm font-bold ${best&&name===best[0]?"text-emerald-400":"text-slate-300"}`}>{fmtMoney(data.cost)}</div>

// ---------- FACTURAS ----------
function FacturasPage({products,setProducts}){
  const [invoices,setInvoices]=useLocalStorage("invoices",[]);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({supplier:"DULCEZA",productId:"",qty:1,cost:0});

  const addInvoice=()=>{
    if(!form.productId||form.qty<1)return;
    const prod=products.find(p=>p.id===form.productId);
    if(!prod)return;
    const inv={id:Date.now(),supplier:form.supplier,productName:prod.name,qty:parseInt(form.qty),cost:parseFloat(form.cost),date:new Date().toISOString(),total:parseInt(form.qty)*parseFloat(form.cost)};
    setInvoices(prev=>[inv,...prev]);
    setProducts(prev=>prev.map(p=>{
      if(p.id!==form.productId)return p;
      const sup=p.suppliers[form.supplier]||{cost:parseFloat(form.cost),qty:0};
      return{...p,stock:p.stock+parseInt(form.qty),suppliers:{...p.suppliers,[form.supplier]:{cost:parseFloat(form.cost),qty:(sup.qty||0)+parseInt(form.qty)}}};
    }));
    setShowForm(false);
    setForm({supplier:"DULCEZA",productId:"",qty:1,cost:0});
  };

  const totalPurchased=invoices.reduce((s,i)=>s+i.total,0);

  return (
    <div className="max-w-6xl mx-auto px-3 py-4 safe-bottom">
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-xl font-bold text-white">🧾 Facturas de Compra</h2>
        <button onClick={()=>setShowForm(!showForm)} className="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition">+ Nueva Compra</button>
      </div>

      {showForm&&(
        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 mb-4">
          <div className="grid sm:grid-cols-4 gap-3">
            <select value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})} className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
              <option>DULCEZA</option><option>SUPERMAXI</option><option>TITAN</option>
            </select>
            <select value={form.productId} onChange={e=>{const p=products.find(x=>x.id===e.target.value);setForm({...form,productId:e.target.value,cost:p?(p.suppliers[form.supplier]?.cost||getAvgCost(p)):0});}} className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
              <option value="">Seleccionar producto</option>
              {products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            <input type="number" min="1" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} placeholder="Cantidad" className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white" />
            <input type="number" step="0.01" value={form.cost} onChange={e=>setForm({...form,cost:e.target.value})} placeholder="Costo unitario" className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white" />
          </div>
          <button onClick={addInvoice} className="mt-3 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition w-full sm:w-auto">Guardar Compra</button>
        </div>
      )}

      <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 mb-4">
        <div className="flex items-center justify-between">
          <span className="text-sm text-slate-400">Total Comprado:</span>
          <span className="text-xl font-bold text-red-400">{fmtMoney(totalPurchased)}</span>
        </div>
      </div>

      <div className="space-y-2">
        {invoices.map(inv=> (
          <div key={inv.id} className="bg-slate-800 rounded-xl p-3 border border-slate-700 flex items-center justify-between">
            <div>
              <div className="text-sm font-semibold text-white">{inv.productName}</div>
              <div className="text-[10px] text-slate-400">{inv.supplier} • {new Date(inv.date).toLocaleDateString("es-EC")}</div>
            </div>
            <div className="text-right">
              <div className="text-sm font-bold text-slate-200">{inv.qty} uds × {fmtMoney(inv.cost)}</div>
              <div className="text-xs font-bold text-red-400">-{fmtMoney(inv.total)}</div>
            </div>
          </div>
        ))}
        {!invoices.length&&<p className="text-center text-slate-500 py-8">Sin compras registradas</p>}
      </div>
    </div>
  );
}

// ---------- INFORMES ----------
function InformesPage({products}){
  const [invoices]=useLocalStorage("invoices",[]);

  const totalPurchased=invoices.reduce((s,i)=>s+i.total,0);
  const totalSales=products.reduce((s,p)=>s+p.totalSales,0);
  const totalSold=products.reduce((s,p)=>s+p.salesCount,0);
  const grossProfit=totalSales-totalPurchased;
  const profitMargin=totalSales>0?((grossProfit/totalSales)*100).toFixed(1):"0.0";

  // Por categoría
  const byCategory={};
  products.forEach(p=>{
    if(!byCategory[p.category])byCategory[p.category]={sales:0,cost:0,profit:0,count:0};
    const best=getBestSupplier(p);
    const cost=best?best[1].cost:getAvgCost(p);
    byCategory[p.category].sales+=p.totalSales;
    byCategory[p.category].cost+=cost*p.salesCount;
    byCategory[p.category].profit+=p.totalSales-(cost*p.salesCount);
    byCategory[p.category].count+=p.salesCount;
  });

  // Por proveedor
  const bySupplier={DULCEZA:0,SUPERMAXI:0,TITAN:0};
  invoices.forEach(i=>{if(bySupplier[i.supplier]!==undefined)bySupplier[i.supplier]+=i.total;});

  return (
    <div className="max-w-6xl mx-auto px-3 py-4 safe-bottom">
      <h2 className="text-xl font-bold text-white mb-4">📈 Informes Financieros</h2>

      {/* KPIs principales */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <div className="bg-gradient-to-br from-red-900/40 to-slate-800 rounded-xl p-4 border border-red-500/20">
          <div className="text-xs text-red-400 mb-1">💸 Total Gastado</div>
          <div className="text-2xl font-bold text-white">{fmtMoney(totalPurchased)}</div>
          <div className="text-[10px] text-slate-500">en compras</div>
        </div>
        <div className="bg-gradient-to-br from-emerald-900/40 to-slate-800 rounded-xl p-4 border border-emerald-500/20">
          <div className="text-xs text-emerald-400 mb-1">💰 Total Vendido</div>
          <div className="text-2xl font-bold text-white">{fmtMoney(totalSales)}</div>
          <div className="text-[10px] text-slate-500">{totalSold} unidades</div>
        </div>
        <div className="bg-gradient-to-br from-blue-900/40 to-slate-800 rounded-xl p-4 border border-blue-500/20">
          <div className="text-xs text-blue-400 mb-1">📊 Utilidad Neta</div>
          <div className={`text-2xl font-bold ${grossProfit>=0?"text-emerald-400":"text-red-400"}`}>{fmtMoney(grossProfit)}</div>
          <div className="text-[10px] text-slate-500">{profitMargin}% margen</div>
        </div>

            <div key={sup} className="py-2 border-b border-slate-700 last:border-0">
              <div className="flex justify-between items-center mb-1">
                <span className="text-sm text-slate-200">{sup}</span>
                <span className="text-sm font-bold text-red-400">-{fmtMoney(amount)}</span>
              </div>
              <div className="w-full bg-slate-700 rounded-full h-1.5 mt-1">
                <div className="bg-red-500 h-1.5 rounded-full" style={{width:Math.min(100,(amount/Math.max(...Object.values(bySupplier)))*100)+"%"}}></div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Utilidad por producto */}
      <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
        <h3 className="text-sm font-bold text-white mb-3">📈 Utilidad por Producto</h3>
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="text-slate-400 border-b border-slate-700">
                <th className="text-left py-2">Producto</th>
                <th className="text-right py-2">Vendido</th>
                <th className="text-right py-2">Ingresos</th>
                <th className="text-right py-2">Costo</th>
                <th className="text-right py-2">Utilidad</th>
              </tr>
            </thead>
            <tbody>
              {[...products].sort((a,b)=>{
                const pa=(a.totalSales-((getBestSupplier(a)?.[1].cost||getAvgCost(a))*a.salesCount));
                const pb=(b.totalSales-((getBestSupplier(b)?.[1].cost||getAvgCost(b))*b.salesCount));
                return pb-pa;
              }).map(p=>{
                const best=getBestSupplier(p);
                const cost=best?best[1].cost:getAvgCost(p);
                const revenue=p.totalSales;
                const costTotal=cost*p.salesCount;
                const profit=revenue-costTotal;
                return (
                  <tr key={p.id} className="border-b border-slate-700/50">
                    <td className="py-2 text-slate-200">{p.name}</td>
                    <td className="py-2 text-right text-slate-400">{p.salesCount}</td>
                    <td className="py-2 text-right text-emerald-400">{fmtMoney(revenue)}</td>
                    <td className="py-2 text-right text-red-400">-{fmtMoney(costTotal)}</td>
                    <td className={`py-2 text-right font-bold ${profit>=0?"text-emerald-400":"text-red-400"}`}>{fmtMoney(profit)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------- PRESUPUESTO INTELIGENTE ----------
function PresupuestoPage({products,setProducts}){
  const [budget,setBudget]=useLocalStorage("budgetSettings",{});

  const recommendations=products.map(p=>{
    const best=getBestSupplier(p);
    const cost=best?best[1].cost:getAvgCost(p);
    const profit=p.price-cost;
    const sellRate=p.salesCount>0?p.salesCount:0.1;
    const dailySales=sellRate;

    let recommendedQty=0;
    let status="normal";
    let message="";

    if(p.salesCount===0&&p.stock>5){
      recommendedQty=0;
      status="low-demand";
      message="Sin ventas. No comprar más hasta agotar stock.";
    }else if(dailySales<0.5&&p.stock>3){
      recommendedQty=Math.max(0,3-p.stock);
      status="slow";
      message="Baja rotación. Mínimo stock.";
    }else if(dailySales>=0.5&&dailySales<2){
      recommendedQty=Math.ceil(dailySales*7)-p.stock;
      status="normal";
      message="Rotación normal. Stock para 7 días.";
    }else if(dailySales>=2){
      recommendedQty=Math.ceil(dailySales*14)-p.stock;
      status="hot";
      message="🔥 Alto demanda. Stock para 14 días.";
    }

    recommendedQty=Math.max(0,recommendedQty);
    const investment=recommendedQty*cost;

    return{...p,bestSupplier:best?best[0]:"",cost,profit,status,message,recommendedQty,investment,dailySales};
  }).sort((a,b)=>{
    const priority={hot:3,normal:2,slow:1,"low-demand":0};
    return priority[b.status]-priority[a.status];
  });

  const totalInvestment=recommendations.reduce((s,r)=>s+r.investment,0);
  const hotProducts=recommendations.filter(r=>r.status==="hot");
  const slowProducts=recommendations.filter(r=>r.status==="slow"||r.status==="low-demand");

  return (
    <div className="max-w-6xl mx-auto px-3 py-4 safe-bottom">
      <h2 className="text-xl font-bold text-white mb-1">🎯 Presupuesto Inteligente</h2>
      <p className="text-xs text-slate-400 mb-4">Ajusta compras según velocidad de venta</p>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
          <div className="text-xs text-slate-400 mb-1">💰 Inversión Sugerida</div>
          <div className="text-2xl font-bold text-orange-400">{fmtMoney(totalInvestment)}</div>
        </div>
        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
          <div className="text-xs text-slate-400 mb-1">🔥 Productos Hot</div>
          <div className="text-2xl font-bold text-red-400">{hotProducts.length}</div>
        </div>
        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
          <div className="text-xs text-slate-400 mb-1">🐌 Baja Rotación</div>
          <div className="text-2xl font-bold text-slate-400">{slowProducts.length}</div>
        </div>
        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
          <div className="text-xs text-slate-400 mb-1">📦 Total a Comprar</div>
          <div className="text-2xl font-bold text-blue-400">{recommendations.reduce((s,r)=>s+r.recommendedQty,0)} uds</div>
        </div>
      </div>

      {slowProducts.length>0&&(
        <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 mb-4">
          <h3 className="text-sm font-bold text-amber-400 mb-2">⚠️ Productos con Baja Demanda</h3>
          <p className="text-xs text-slate-300">Estos productos no se venden bien. Se recomienda NO comprar más hasta agotar el stock actual.</p>
        </div>
      )}

      <div className="space-y-3">
        {recommendations.map(r=> (
          <div key={r.id} className={`bg-slate-800 rounded-xl border p-4 transition ${r.status==="hot"?"border-red-500/30":r.status==="slow"?"border-amber-500/30":"border-slate-700"}`}>
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2">
                <span className={`w-2 h-2 rounded-full ${r.status==="hot"?"bg-red-500 animate-pulse":r.status==="normal"?"bg-emerald-500":r.status==="slow"?"bg-amber-500":"bg-slate-500"}`}></span>
                <h3 className="text-sm font-bold text-white">{r.name}</h3>
                <span className="text-[10px] text-slate-400">{r.category}</span>
              </div>
              <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${r.status==="hot"?"bg-red-500/20 text-red-400":r.status==="normal"?"bg-emerald-500/20 text-emerald-400":r.status==="slow"?"bg-amber-500/20 text-amber-400":"bg-slate-700 text-slate-400"}`}>
                {r.status==="hot"?"🔥 ALTA DEMANDA":r.status==="normal"?"✅ NORMAL":r.status==="slow"?"🐌 LENTO":"⏸️ SIN VENTAS"}
              </span>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
              <div className="bg-slate-900/50 rounded-lg p-2 text-center">
                <div className="text-[10px] text-slate-400">Stock</div>
                <div className="text-sm font-bold text-white">{r.stock}</div>
              </div>
              <div className="bg-slate-900/50 rounded-lg p-2 text-center">
                <div className="text-[10px] text-slate-400">Vendidos</div>
                <div className="text-sm font-bold text-emerald-400">{r.salesCount}</div>
              </div>
              <div className="bg-slate-900/50 rounded-lg p-2 text-center">
                <div className="text-[10px] text-slate-400">Comprar</div>
                <div className={`text-sm font-bold ${r.recommendedQty>0?"text-orange-400":"text-slate-500"}`}>{r.recommendedQty} uds</div>
              </div>
              <div className="bg-slate-900/50 rounded-lg p-2 text-center">
                <div className="text-[10px] text-slate-400">Inversión</div>
                <div className="text-sm font-bold text-white">{fmtMoney(r.investment)}</div>
              </div>
            </div>

            <div className="flex items-center justify-between">
              <p className="text-[10px] text-slate-400 italic">💡 {r.message}</p>
              {Object.keys(r.suppliers).length>1&&(
                <span className="text-[10px] text-emerald-400">✓ Mejor: {r.bestSupplier} a {fmtMoney(r.cost)}</span>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- BASE DE DATOS ----------
function DatabasePage({products,setProducts}){
  const [filter,setFilter]=useState("");
  const [showForm,setShowForm]=useState(false);
  const [newProduct,setNewProduct]=useState({name:"",category:"Bebidas",stock:0,price:0,supplier:"DULCEZA",cost:0});
  const filtered=products.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()));

  const categories=["Bebidas","Lácteos","Dulces","Chocolates","Galletas","Snacks"];
  const suppliersList=["DULCEZA","SUPERMAXI","TITAN"];

  const addProduct=()=>{
    if(!newProduct.name||newProduct.price<=0)return;
    const id=(Math.max(...products.map(p=>parseInt(p.id)),0)+1).toString();
    const prod={
      id,
      name:newProduct.name.toUpperCase(),
      category:newProduct.category,
      stock:parseInt(newProduct.stock)||0,
      price:parseFloat(newProduct.price),
      suppliers:{[newProduct.supplier]:{cost:parseFloat(newProduct.cost)||0,qty:parseInt(newProduct.stock)||0}},
      salesCount:0,
      totalSales:0
    };
    setProducts(prev=>[...prev,prod]);
    setNewProduct({name:"",category:"Bebidas",stock:0,price:0,supplier:"DULCEZA",cost:0});
    setShowForm(false);
  };

  const deleteProduct=(id)=>{
    if(!confirm("¿Eliminar este producto?"))return;
    setProducts(prev=>prev.filter(p=>p.id!==id));
  };

  return (
    <div className="max-w-6xl mx-auto px-3 py-4 safe-bottom">
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-xl font-bold text-white">🗄 Base de Datos</h2>
        <button onClick={()=>setShowForm(!showForm)} className="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition">+ Agregar Producto</button>
      </div>

      {showForm&&(
        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 mb-4">
          <h3 className="text-sm font-bold text-white mb-3">➕ Nuevo Producto</h3>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-3">
            <input value={newProduct.name} onChange={e=>setNewProduct({...newProduct,name:e.target.value})} placeholder="Nombre del producto" className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white" />
            <select value={newProduct.category} onChange={e=>setNewProduct({...newProduct,category:e.target.value})} className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
              {categories.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            <input type="number" min="0" value={newProduct.stock} onChange={e=>setNewProduct({...newProduct,stock:e.target.value})} placeholder="Stock inicial" className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white" />
            <input type="number" step="0.01" min="0" value={newProduct.price} onChange={e=>setNewProduct({...newProduct,price:e.target.value})} placeholder="Precio de venta" className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white" />
            <select value={newProduct.supplier} onChange={e=>setNewProduct({...newProduct,supplier:e.target.value})} className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
              {suppliersList.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
            <input type="number" step="0.01" min="0" value={newProduct.cost} onChange={e=>setNewProduct({...newProduct,cost:e.target.value})} placeholder="Costo unitario" className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white" />
          </div>
          <div className="flex gap-2">
            <button onClick={()=>setShowForm(false)} className="px-4 py-2 rounded-lg bg-slate-700 text-white text-sm font-semibold">Cancelar</button>
            <button onClick={addProduct} className="px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold">Guardar Producto</button>
          </div>
        </div>
      )}

      <input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="Buscar producto..." className="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-sm text-white mb-4" />
      <div className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="text-slate-400 border-b border-slate-700 bg-slate-900/50">
                <th className="text-left py-3 px-3">Producto</th>
                <th className="text-left py-3 px-3">Categoría</th>
                <th className="text-right py-3 px-3">Stock</th>
                <th className="text-right py-3 px-3">Precio Venta</th>
                <th className="text-right py-3 px-3">Mejor Costo</th>
                <th className="text-right py-3 px-3">Margen</th>
                <th className="text-left py-3 px-3">Proveedores</th>
                <th className="text-center py-3 px-3">Acción</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(p=>{
                const best=getBestSupplier(p);
                const cost=best?best[1].cost:getAvgCost(p);
                const margin=((p.price-cost)/p.price*100).toFixed(1);
                return (
                  <tr key={p.id} className="border-b border-slate-700/50 hover:bg-slate-700/30">
                    <td className="py-2 px-3 text-slate-200 font-medium">{p.name}</td>
                    <td className="py-2 px-3 text-slate-400">{p.category}</td>
                    <td className="py-2 px-3 text-right text-white">{p.stock}</td>
                    <td className="py-2 px-3 text-right text-emerald-400">{fmtMoney(p.price)}</td>
                    <td className="py-2 px-3 text-right text-amber-400">{fmtMoney(cost)}</td>
                    <td className="py-2 px-3 text-right text-blue-400">{margin}%</td>
                    <td className="py-2 px-3">
                      <div className="flex gap-1 flex-wrap">
                        {Object.keys(p.suppliers).map(s=> (
                          <span key={s} className={`text-[9px] px-1.5 py-0.5 rounded-full ${best&&s===best[0]?"bg-emerald-500/20 text-emerald-400":"bg-slate-700 text-slate-400"}`}>{s}</span>
                        ))}
                      </div>
                    </td>
                    <td className="py-2 px-3 text-center">
                      <button onClick={()=>deleteProduct(p.id)} className="text-[10px] text-red-400 hover:text-red-300 font-medium">🗑 Eliminar</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------- APP PRINCIPAL ----------
function App(){
  const [page,setPage]=useState("machine");
  const [products,setProducts]=useLocalStorage("vending-products",INITIAL_PRODUCTS,(saved,initial)=>{
    const map=new Map(initial.map(p=>[p.id,p]));
    return saved.map(p=>{
      const orig=map.get(p.id);
      return orig?{...orig,...p,image:orig.image}:p;
    });
  });
  const [suppliers,setSuppliers]=useLocalStorage("vending-suppliers",INITIAL_SUPPLIERS);

  useEffect(()=>{
    const el=document.getElementById("clock-display");
    if(!el)return;
    const tick=()=>{el.textContent=new Date().toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"});};
    tick();
    const iv=setInterval(tick,60000);
    return()=>clearInterval(iv);
  },[]);

  return (
    <div className="min-h-screen bg-slate-900">
      <TopNav page={page} setPage={setPage} />
      <main className="pb-20">
        {page==="machine"&&<MachinePage products={products} setProducts={setProducts} />}
        {page==="resumen"&&<ResumenPage products={products} />}
        {page==="proveedores"&&<ProveedoresPage suppliers={suppliers} setSuppliers={setSuppliers} products={products} />}
        {page==="facturas"&&<FacturasPage products={products} setProducts={setProducts} />}
        {page==="informes"&&<InformesPage products={products} />}
        {page==="presupuesto"&&<PresupuestoPage products={products} setProducts={setProducts} />}
        {page==="database"&&<DatabasePage products={products} setProducts={setProducts} />}
      </main>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
